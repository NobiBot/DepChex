[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "depchex"
version = "0.1.0"
description = "Dependency confusion scanner for Python projects"
requires-python = ">=3.10"
dependencies = ["httpx", "textual"]

[project.scripts]
dpchex = "depchex.app:main"
